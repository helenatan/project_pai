name: Daily Pipeline

on:
  schedule:
    - cron: '0 14 * * *'   # Daily 6am PT (14:00 UTC)
  workflow_dispatch:         # allow manual trigger for testing

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run fetcher (Adzuna + JSearch)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: python pipeline/scripts/fetch.py

      - name: Run employer-board fetcher (Greenhouse + Ashby)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/scripts/fetch_employers.py

      - name: Run enricher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/scripts/enrich.py --version v1.0

      - name: Run aggregator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/scripts/aggregate.py

      # Fails the run (and fires the alert) when any source is missing, logged
      # as failed, or fetched well below its trailing baseline. Runs after the
      # aggregator so the degraded snapshot is already written, and before the
      # digest so a digest is never sent on broken coverage.
      - name: Coverage check — fail on silent or thin sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/scripts/check_coverage.py

      - name: QA check — top 10 companies vs live ATS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/scripts/test_top_companies.py
        continue-on-error: true   # report discrepancies but don't block digest

      - name: Run digest (Saturdays only -- script self-guards)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python pipeline/scripts/digest.py

      # Weekly backups live in .github/workflows/backup.yml (Saturdays + manual).

      - name: Alert on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          from: PM Adaptation Index <${{ secrets.ALERT_EMAIL_USER }}>
          to: ${{ secrets.ALERT_EMAIL_USER }}
          subject: "PM Adaptation Index: pipeline OK (${{ github.run_number }})"
          body: "Daily pipeline completed. Snapshot written."

      - name: Alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          from: PM Adaptation Index <${{ secrets.ALERT_EMAIL_USER }}>
          to: ${{ secrets.ALERT_EMAIL_USER }}
          subject: "ALERT: PM Adaptation Index pipeline FAILED"
          body: "Daily pipeline failed. Check GitHub Actions logs immediately."
